name: CI

on:
  push:
    paths:
      - "packages/**"
      - "artifacts/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "app/**"
      - "verify.sh"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "packages/**"
      - "artifacts/**"
      - "fixtures/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "app/**"
      - "verify.sh"
      - ".github/workflows/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # verify.sh is the single source of truth for what "passing" means --
      # both project-graph type checks (root + app/ + artifacts/, build mode,
      # for the reasons documented in verify.sh itself) and both test suites
      # (engine + desktop app). Previously these three commands were
      # hand-duplicated here, and the two copies drifted apart twice already
      # (F-93dc0160: a vacuous `tsc --noEmit` shipped here while verify.sh had
      # the real build-mode invocation; F-63e4ed6a: the app test suite was
      # missing from this job entirely). Calling verify.sh directly makes that
      # class of drift structurally impossible instead of relying on
      # contributors to keep two copies in sync by hand.
      - name: Verify
        run: bash verify.sh

  # The Rust half of the desktop app had no automated check at all: the test job
  # never compiled it, and build-desktop runs only on release, so a change under
  # src-tauri could merge with nothing ever building it.
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tauri::generate_context!() embeds the frontend bundle at COMPILE time,
      # so app/dist has to exist before cargo will even check this crate.
      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # --all-targets so #[cfg(test)] code compiles too; otherwise the path
      # containment tests could rot without anything noticing.
      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --all-targets --locked

      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test --locked

  build-desktop:
    if: github.event_name == 'release'
    needs: [test, cargo-check]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Bundle bridge worker
        working-directory: app
        run: node scripts/bundle-bridge.mjs

      - name: Build Tauri app
        working-directory: app
        run: npx tauri build

      - name: Upload MSI to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
